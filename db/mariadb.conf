# MariaDB Configuration File
# /etc/mysql/mariadb.conf.d/50-server.cnf

[server]

[mariadb]

# General Settings
user            = mysql
pid-file       = /var/run/mysqld/mysqld.pid
basedir       = /usr
datadir       = /var/lib/mysql
tmpdir        = /tmp

bind-address   = 0.0.0.0

expire_logs_days = 10

[embedded]

[mariadb]

[mariadb-11.8]