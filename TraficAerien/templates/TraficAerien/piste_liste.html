{% extends 'TraficAerien/base.html' %}
{% block title %}Pistes{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-distribute-horizontal"></i> Pistes</h3>
    <a href="{% url 'piste_creer' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Ajouter
    </a>
</div>
<div class="card">
    <table class="table table-hover mb-0">
        <thead>
            <tr><th>Numéro</th><th>Aéroport</th><th>Longueur (m)</th><th>Actions</th></tr>
        </thead>
        <tbody>
            {% for p in pistes %}
            <tr>
                <td>{{ p.numero }}</td>
                <td>{{ p.aeroport }}</td>
                <td>{{ p.longueur }}</td>
                <td>
                    <a href="{% url 'piste_modifier' p.pk %}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a href="{% url 'piste_supprimer' p.pk %}" class="btn btn-sm btn-danger">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="text-center text-muted">Aucune piste enregistrée</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
