{% extends 'TraficAerien/base.html' %}

{% block title %}Aéroports{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-building"></i> Aéroports</h3>
    <a href="{% url 'aeroport_creer' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Ajouter
    </a>
</div>
<div class="card">
    <table class="table table-hover mb-0">
        <thead class="table-dark">
            <tr>
                <th>ID</th><th>Nom</th><th>Pays</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for a in aeroports %}
            <tr>
                <td>{{ a.id }}</td>
                <td>{{ a.nom }}</td>
                <td>{{ a.pays }}</td>
                <td>
                    <a href="{% url 'aeroport_modifier' a.pk %}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a href="{% url 'aeroport_supprimer' a.pk %}" class="btn btn-sm btn-danger">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="text-center text-muted">Aucun aéroport enregistré</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
