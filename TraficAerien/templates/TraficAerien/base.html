<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion Trafic Aérien{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icônes Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background-color: #f0f4f8; }
        .navbar { background-color: #0d1b2a; }
        .navbar-brand { color: #ffffff; font-weight: bold; font-size: 1.3rem; }
        .nav-link { color: #adb5bd !important; }
        .nav-link:hover { color: #ffffff !important; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #1b2a3b; padding-top: 1rem; }
        .sidebar .nav-link { color: #adb5bd; padding: 0.6rem 1.2rem; border-radius: 6px; margin: 2px 8px; }
        .sidebar .nav-link:hover { background-color: #2c3e50; color: white !important; }
        .sidebar .nav-link i { margin-right: 8px; }
        .main-content { padding: 2rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <i class="bi bi-airplane"></i> AirTraffic Manager
        </a>
    </div>
</nav>

<!-- CORPS : sidebar + contenu -->
<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <nav class="col-md-2 d-none d-md-block sidebar">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-house"></i> Accueil</a>
                </li>
                <hr style="border-color: #2c3e50;">
                <small class="text-muted px-3">DONNÉES</small>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-building"></i> Aéroports</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-grid"></i> Pistes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-briefcase"></i> Compagnies</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-airplane-engines"></i> Types d'avions</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-airplane-fill"></i> Avions</a>
                </li>
                <hr style="border-color: #2c3e50;">
                <small class="text-muted px-3">VOLS</small>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-calendar3"></i> Vols</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-upload"></i> Import CSV</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="bi bi-file-earmark-text"></i> Fiches de vols</a>
                </li>
            </ul>
        </nav>

        <!-- CONTENU PRINCIPAL -->
        <main class="col-md-10 main-content">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}
        </main>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
