<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestion Trafic Aérien{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ── NAVBAR ── */
        .navbar {
            background-color: #0d1b2a;
            height: 56px;
        }
        .navbar-brand {
            color: #ffffff !important;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }
        .navbar-brand i {
            color: #4ea8de;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #1b2a3b;
            padding: 1rem 0;
            position: sticky;
            top: 56px;
        }
        .sidebar .section-label {
            color: #5a7a9a;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.5rem 1.2rem;
            margin-top: 0.5rem;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            padding: 0.55rem 1.2rem;
            border-radius: 8px;
            margin: 2px 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover {
            background-color: #2c3e50;
            color: #ffffff !important;
        }
        .sidebar .nav-link.active {
            background-color: #4ea8de;
            color: #ffffff !important;
        }
        .sidebar .nav-link i {
            margin-right: 8px;
            width: 16px;
        }
        .sidebar hr {
            border-color: #2c3e50;
            margin: 0.5rem 1rem;
        }

        /* ── CONTENU PRINCIPAL ── */
        .main-content {
            padding: 2rem;
            min-height: calc(100vh - 56px);
        }

        /* ── CARDS ── */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* ── TABLES ── */
        .table thead {
            background-color: #0d1b2a;
            color: white;
        }
        .table tbody tr:hover {
            background-color: #e8f0fe;
        }

        /* ── BOUTONS ── */
        .btn-primary {
            background-color: #4ea8de;
            border-color: #4ea8de;
        }
        .btn-primary:hover {
            background-color: #3a8fc7;
            border-color: #3a8fc7;
        }
    </style>
</head>
<body>

<!-- ══════════════ NAVBAR ══════════════ -->
<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-3">
        <a class="navbar-brand" href="{% url 'index' %}">
            <i class="bi bi-airplane-fill me-2"></i>AirTraffic Manager
        </a>
    </div>
</nav>

<!-- ══════════════ CORPS ══════════════ -->
<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- ── SIDEBAR ── -->
        <nav class="col-md-2 sidebar d-none d-md-block">
            <ul class="nav flex-column">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}">
                        <i class="bi bi-house-fill"></i> Accueil
                    </a>
                </li>

                <hr>
                <div class="section-label">Données</div>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'aeroport_liste' %}">
                        <i class="bi bi-building"></i> Aéroports
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'piste_liste' %}">
                        <i class="bi bi-distribute-horizontal"></i> Pistes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'compagnie_liste' %}">
                        <i class="bi bi-briefcase-fill"></i> Compagnies
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'typeavion_liste' %}">
                        <i class="bi bi-airplane-engines"></i> Types d'avions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'avion_liste' %}">
                        <i class="bi bi-airplane-fill"></i> Avions
                    </a>
                </li>

                <hr>
                <div class="section-label">Vols</div>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'vol_liste' %}">
                        <i class="bi bi-calendar3"></i> Vols
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'import_vols_csv' %}">
                        <i class="bi bi-upload"></i> Import CSV
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'fiche_vols' %}">
                        <i class="bi bi-file-earmark-text"></i> Fiches de vols
                    </a>
                </li>

            </ul>
        </nav>

        <!-- ── CONTENU ── -->
        <main class="col-md-10 main-content">

            <!-- Messages Django (erreurs, succès) -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}

        </main>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
