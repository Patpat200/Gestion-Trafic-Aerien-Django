{% extends 'TraficAerien/base.html' %}

{% block title %}Accueil — AirTraffic Manager{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="bi bi-house"></i> Tableau de bord</h2>
        <p class="text-muted">Bienvenue dans l'interface de gestion du trafic aérien.</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-4">
        <div class="card text-center p-3">
            <i class="bi bi-building fs-1 text-primary"></i>
            <h5 class="mt-2">Aéroports</h5>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center p-3">
            <i class="bi bi-airplane-fill fs-1 text-success"></i>
            <h5 class="mt-2">Avions</h5>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center p-3">
            <i class="bi bi-calendar3 fs-1 text-warning"></i>
            <h5 class="mt-2">Vols</h5>
        </div>
    </div>
</div>
{% endblock %}
