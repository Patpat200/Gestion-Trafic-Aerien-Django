name: Deploiement MkDocs

# Le script se lance à chaque fois que tu fais un git push sur la branche main
on:
  push:
    branches:
      - main

# On autorise le script à écrire sur le dépôt (pour créer la page web)
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Le robot clone ton code
      - uses: actions/checkout@v3

      # 2. Il installe Python sur son mini-serveur
      - name: Installation de Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      # 3. Il installe l'outil MkDocs et le beau thème Material
      - name: Installation des dépendances MkDocs
        run: pip install mkdocs-material

      # 4. Il génère le site et le met en ligne sur GitHub Pages !
      - name: Déploiement du site
        run: mkdocs gh-deploy --force